<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NASA 每日一天文圖：選一個日期，看 NASA 那天挑的宇宙照片或影片與說明。" />
    <title>NASA 每日一天文圖 | Mark Yang</title>
    <!-- 區塊：深淺色主題 · 用途：沿用首頁記住的深淺色設定 · 不需要可整段刪掉（會固定淺色） -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/styles/design-tokens.css" />
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <main class="site-shell tool-page">
      <!-- 區塊：返回列 · 用途：回作品集首頁 · 不需要可整段刪掉 -->
      <a class="tool-back" href="/">← 回作品集</a>

      <!-- 區塊：標題 · 用途：說明這個工具在做什麼 · 不可刪（使用者會不知道這頁是什麼） -->
      <header class="tool-header">
        <p class="eyebrow">API Tool · Week 4</p>
        <h1 class="tool-title">NASA 每日一天文圖</h1>
        <p class="tool-lead">
          NASA 從 1995 年 6 月 16 日起每天挑一張宇宙照片或影片，附上天文學家寫的說明。選一個日期，看那天的宇宙。
        </p>
      </header>

      <!-- 區塊：查詢列 · 用途：選日期、前一天／後一天 · 不可刪（工具的核心） -->
      <form class="tool-card tool-form" id="apodForm" novalidate>
        <div class="tool-field">
          <label for="apodDate">日期（美國東部時間）</label>
          <input id="apodDate" name="date" type="date" min="1995-06-16" required />
        </div>
        <div class="tool-actions">
          <button class="button button-primary" type="submit" id="searchButton">查詢</button>
          <button class="button button-ghost" type="button" id="prevButton">← 前一天</button>
          <button class="button button-ghost" type="button" id="nextButton">後一天 →</button>
        </div>
        <p class="apod-quota" id="quota" aria-live="polite"></p>
      </form>

      <!-- 區塊：結果區 · 用途：載入中、成功、沒有資料、出錯了四種狀態 · 不可刪（使用者看不到結果） -->
      <section class="tool-card tool-result" id="result" data-state="loading" aria-live="polite" aria-busy="true">
        <p class="tool-result-message">載入中…</p>
      </section>

      <!-- 區塊：資料說明 · 用途：交代資料來源、金鑰與額度 · 不需要可整段刪掉 -->
      <section class="tool-note">
        <h2>資料來源</h2>
        <p>
          資料來自 NASA 的 APOD API。金鑰放在網站的伺服器端，不會出現在網頁原始碼裡。查過的日期會先存在這個分頁裡，再看一次不會再打 API。日期以美國東部時間為準，所以台灣早上看到的「今天」可能還是美國的昨天。
        </p>
      </section>
    </main>

    <!-- 區塊：查詢邏輯 · 用途：事件 → 呼叫 API → 更新畫面 · 不可刪（按鈕會沒反應） -->
    <script>
      // 打自己網站的 /api/apod（api/apod.js），由伺服器帶金鑰去問 NASA；前端完全不碰金鑰
      const API_URL = "/api/apod";
      const FIRST_DATE = "1995-06-16";
      const TIMEOUT_MS = 8000;      // 每次請求最多等 8 秒
      const RETRY_DELAY_MS = 1000;  // 重試前先等 1 秒，避免馬上又打到同一個故障
      const CACHE_PREFIX = "apod:";

      const form = document.getElementById("apodForm");
      const dateInput = document.getElementById("apodDate");
      const searchButton = document.getElementById("searchButton");
      const prevButton = document.getElementById("prevButton");
      const nextButton = document.getElementById("nextButton");
      const quota = document.getElementById("quota");
      const result = document.getElementById("result");

      let currentDate = null;   // 目前畫面上（或剛才嘗試查詢）的日期
      let lastRequest = null;   // 出錯時「重試」要重送的日期；null 代表「最新一天」
      let loading = false;
      let lastRemaining = null; // 這個小時還剩幾次，從回應標頭讀

      // ---------- 日期工具 ----------

      // APOD 以美國東部時間換日；en-CA 格式剛好是 YYYY-MM-DD
      function easternToday() {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());
      }

      function shiftDate(iso, days) {
        const d = new Date(`${iso}T00:00:00Z`);
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
      }

      // ---------- 快取：存取都包 try/catch，無痕模式下可能不能用 ----------

      function readCache(date) {
        try {
          const raw = sessionStorage.getItem(CACHE_PREFIX + date);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function writeCache(date, data) {
        try {
          sessionStorage.setItem(CACHE_PREFIX + date, JSON.stringify(data));
        } catch (e) {}
      }

      // ---------- 呼叫 API ----------

      // kind：http（伺服器有回應但不是 2xx）、timeout（超過 8 秒）、network（斷線或被擋）
      class ApiError extends Error {
        constructor(kind, status = 0, detail = "") {
          super(detail || kind);
          this.kind = kind;
          this.status = status;
        }
      }

      function readRemaining(res) {
        const value = res.headers.get("X-RateLimit-Remaining");
        if (value !== null && value !== "") lastRemaining = Number(value);
      }

      async function fetchOnce(date) {
        const url = new URL(API_URL, location.origin);
        if (date) url.searchParams.set("date", date);

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
          const res = await fetch(url, { signal: controller.signal });
          readRemaining(res);
          let body = null;
          try { body = await res.json(); } catch (e) {}
          if (!res.ok) {
            throw new ApiError("http", res.status, body && (body.msg || (body.error && body.error.message)));
          }
          return body;
        } catch (err) {
          if (err instanceof ApiError) throw err;
          if (err.name === "AbortError") throw new ApiError("timeout");
          throw new ApiError("network");
        } finally {
          clearTimeout(timer);
        }
      }

      // 4xx 是我們送錯或額度用完，再送一次結果也一樣，所以不重試；5xx、斷線、逾時才重試 1 次
      function isRetryable(err) {
        return err.kind !== "http" || err.status >= 500;
      }

      async function fetchWithRetry(date) {
        try {
          return await fetchOnce(date);
        } catch (err) {
          if (!isRetryable(err)) throw err;
          await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY_MS));
          return fetchOnce(date);
        }
      }

      // ---------- 畫面 ----------

      function el(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        Object.assign(node, props);
        for (const child of [].concat(children)) {
          if (child) node.append(child);
        }
        return node;
      }

      function show(state, nodes) {
        result.dataset.state = state;
        result.setAttribute("aria-busy", String(state === "loading"));
        result.replaceChildren(...[].concat(nodes));
        result.classList.remove("is-entering");
        void result.offsetWidth;
        result.classList.add("is-entering");
      }

      function message(text) {
        return el("p", { className: "tool-result-message", textContent: text });
      }

      // 載入中：所有按鈕和日期欄位都鎖住，避免連按送出好幾個請求
      function syncControls() {
        const max = easternToday();
        dateInput.max = max;
        dateInput.disabled = loading;
        searchButton.disabled = loading;
        prevButton.disabled = loading || !currentDate || currentDate <= FIRST_DATE;
        nextButton.disabled = loading || !currentDate || currentDate >= max;
        // 額度很多時不用提醒，剩不到 50 次才顯示
        quota.textContent = lastRemaining !== null && lastRemaining < 50 ? `這個小時還能查 ${lastRemaining} 次` : "";
      }

      function showEmpty(text) {
        show("empty", [
          message(text),
          el("p", { className: "apod-meta" }, [
            el("a", {
              href: currentDate ? `https://apod.nasa.gov/apod/ap${currentDate.slice(2).replace(/-/g, "")}.html` : "https://apod.nasa.gov/apod/",
              target: "_blank",
              rel: "noopener",
              textContent: "到 NASA 官網看這一天 ↗"
            })
          ])
        ]);
      }

      function showError(text) {
        const retry = el("button", { className: "button button-primary", type: "button", textContent: "重試" });
        retry.addEventListener("click", () => load(lastRequest));
        show("error", [message(text), el("div", { className: "tool-actions" }, retry)]);
        retry.focus();
      }

      // API 目前對部分舊日期會回一張「NASA Science」的 NASA 標誌，不是當天的圖，當成沒有資料
      function isPlaceholder(data) {
        return data.title === "NASA Science" && /nasa-logo/.test(data.url || "");
      }

      function buildMedia(data) {
        if (data.media_type === "image") {
          const full = data.hdurl || data.url;
          return el("a", { className: "apod-media apod-zoom", href: full, target: "_blank", rel: "noopener", title: "在新分頁開啟高解析度原圖" },
            el("img", { src: data.url, alt: data.title, loading: "lazy", decoding: "async" }));
        }
        if (data.media_type === "video") {
          // 直接是影片檔就用 <video>；YouTube／Vimeo 這類嵌入網址用 <iframe>
          if (/\.(mp4|webm|ogg)(\?|$)/i.test(data.url)) {
            return el("div", { className: "apod-media" },
              el("video", { src: data.url, controls: true, preload: "metadata", poster: data.thumbnail_url || "", ariaLabel: data.title }));
          }
          return el("div", { className: "apod-media apod-video" },
            el("iframe", { src: data.url, title: data.title, loading: "lazy", allowFullscreen: true, referrerPolicy: "strict-origin-when-cross-origin" }));
        }
        return null;
      }

      function showSuccess(data) {
        const media = buildMedia(data);
        if (!media) {
          showEmpty("這一天的內容是互動網頁或其他格式，沒辦法在這裡顯示。");
          return;
        }
        const meta = [data.date, data.media_type === "video" ? "影片" : "圖片"];
        if (data.copyright) meta.push(`© ${data.copyright.replace(/\s+/g, " ").trim()}`);
        show("success", [
          media,
          el("h2", { className: "apod-title", textContent: data.title }),
          el("p", { className: "apod-meta", textContent: meta.join(" · ") }),
          el("p", { className: "apod-explanation", lang: "en", textContent: data.explanation })
        ]);
      }

      function describeError(err) {
        if (err.kind === "timeout") return "NASA 的伺服器超過 8 秒沒有回應，已經自動重試一次還是不行。";
        if (err.kind === "network") {
          return lastRemaining === 0
            ? "連不上 NASA，可能是查詢次數用完了，請過一陣子再試。"
            : "連不上 NASA，請檢查網路連線。已經自動重試一次。";
        }
        if (err.status >= 500) return `NASA 的伺服器暫時出問題（${err.status}），已經自動重試一次還是不行。`;
        return `查詢失敗（${err.status}），請稍後再試。`;
      }

      // ---------- 主流程 ----------

      async function load(date) {
        lastRequest = date;
        // 第一次載入就失敗時也要有日期，前一天／後一天才按得動
        currentDate = date || currentDate || easternToday();

        const cached = date && readCache(date);
        if (cached) {
          dateInput.value = date;
          showSuccess(cached);
          syncControls();
          return;
        }

        loading = true;
        syncControls();
        show("loading", message(date ? `正在載入 ${date}…` : "正在載入最新一天…"));

        try {
          const data = await fetchWithRetry(date);
          currentDate = data.date;
          dateInput.value = data.date;
          // 佔位圖不存快取，NASA 恢復後再查一次就拿得到真的圖
          if (isPlaceholder(data)) {
            showEmpty("NASA 的資料庫目前沒有提供這一天的圖，可能是 NASA 那邊暫時不穩，換一天或晚點再試。");
          } else {
            writeCache(data.date, data);
            showSuccess(data);
          }
        } catch (err) {
          if (err.kind === "http" && err.status === 429) {
            lastRemaining = 0;
            showEmpty("這個小時的查詢次數用完了，請過一陣子再來。查過的日期還能看。");
          } else if (err.kind === "http" && (err.status === 400 || err.status === 404)) {
            // 400：日期超出範圍；404：當天還沒發布。都不是壞掉，所以走「沒有資料」，不用紅色
            showEmpty(`這一天沒有資料。可以選的範圍是 ${FIRST_DATE} 到 ${easternToday()}。`);
          } else {
            showError(describeError(err));
          }
        } finally {
          loading = false;
          syncControls();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (loading) return;
        const value = dateInput.value;
        if (!value) {
          currentDate = null;
          showEmpty("請先選一個日期。");
          syncControls();
          dateInput.focus();
          return;
        }
        load(value);
      });

      prevButton.addEventListener("click", () => currentDate && load(shiftDate(currentDate, -1)));
      nextButton.addEventListener("click", () => currentDate && load(shiftDate(currentDate, 1)));

      // 一打開就先看今天（美東時間）。明確帶日期，因為 NASA 不帶日期的「最新一天」常回 500；快取有就不用打 API
      load(easternToday());
    </script>
  </body>
</html>
