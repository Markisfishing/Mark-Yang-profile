<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mark Yang 作品集的留言板：留一句話給我，或看看其他訪客說了什麼。" />
    <title>留言板 | Mark Yang</title>
    <!-- 區塊：深淺色主題 · 用途：沿用首頁記住的深淺色設定 · 不需要可整段刪掉（會固定淺色） -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/styles/design-tokens.css?cache-bust=20261127-guestbook3" />
    <link rel="stylesheet" href="/styles/main.css?cache-bust=20261127-guestbook3" />
  </head>
  <body>
    <div class="site-shell">
      <!-- 區塊：導覽列 · 用途：跟首頁同一份導覽列（src/components/SiteNav.vue），「留言板」是第五個分頁 · 不可刪（訪客回不了其他分頁） -->
      <div data-component="SiteNav" data-link-base="/" data-current="guestbook" data-lang="site" data-toggles></div>

    <main class="tool-page guestbook-page">
      <!-- 區塊：標題 · 用途：說明這一頁可以做什麼 · 不可刪（訪客會不知道這頁是什麼） -->
      <header class="tool-header">
        <h1 class="tool-title" data-i18n="title">留言板</h1>
        <p class="tool-lead" data-i18n="lead">想說什麼都可以，不用登入。</p>
      </header>

      <!-- 區塊：主要版面 · 用途：手機上下排（先填再看）；桌面左邊填寫、右邊讀留言，填寫區黏在畫面上捲到哪都看得到 · 不可刪（表單與列表會沒有排版） -->
      <div class="guestbook-layout">
        <!-- 區塊：留言表單 · 用途：填暱稱與留言後送出（POST /api/comments），送出中鎖住按鈕 · 不可刪（沒辦法留言） -->
        <form class="tool-card guestbook-form" id="commentForm" novalidate aria-label="寫留言">
          <div class="guestbook-field">
            <div class="guestbook-label-row">
              <label for="commentName" data-i18n="name">暱稱</label>
              <span class="guestbook-count" id="nameCount"></span>
            </div>
            <input id="commentName" name="name" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="next" data-i18n-placeholder="namePlaceholder" placeholder="例如：路過的工程師" aria-describedby="nameCount nameError" />
            <p class="tool-field-error" id="nameError"></p>
          </div>
          <div class="guestbook-field">
            <div class="guestbook-label-row">
              <label for="commentBody" data-i18n="body">留言</label>
              <span class="guestbook-count" id="bodyCount"></span>
            </div>
            <textarea id="commentBody" name="body" rows="5" maxlength="200" data-i18n-placeholder="bodyPlaceholder" placeholder="建議、合作邀約，或打聲招呼" aria-describedby="bodyCount privacyNote bodyError"></textarea>
            <p class="guestbook-privacy" id="privacyNote" data-i18n="privacy">留言會公開顯示，請勿留下電話、email 等個人資料。</p>
            <p class="tool-field-error" id="bodyError"></p>
          </div>
          <!-- 送出鈕右側的按鍵提示依系統顯示 ⌘ 或 Ctrl，只在有實體鍵盤的裝置出現 -->
          <button class="button button-primary guestbook-submit" type="submit" id="submitButton">
            <span id="submitLabel">送出留言</span>
            <kbd class="guestbook-kbd" id="submitKbd" aria-hidden="true">Ctrl ↵</kbd>
          </button>
          <p class="guestbook-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <!-- 區塊：留言列表 · 用途：讀 GET /api/comments，顯示載入中、沒有留言、讀取失敗（附重試）與留言清單 · 不可刪（看不到留言） -->
        <section class="tool-card tool-result guestbook-list" id="commentList" data-state="loading" aria-live="polite" aria-busy="true">
          <p class="tool-result-message">載入中…</p>
        </section>
      </div>

    </main>
    </div>

    <!-- 區塊：共用元件 · 用途：畫出導覽列 · 不可刪（頁面上方會沒有導覽列）。要放在留言邏輯前面，切換鈕才已經畫好 -->
    <script type="module" src="/src/main.js"></script>

    <!-- 區塊：留言邏輯 · 用途：讀留言、送留言、顯示錯誤，並跟著中英切換重畫 · 不可刪（表單和列表會沒反應） -->
    <script type="module">
      import { setupToolPage } from "/src/tool-page.js";

      const API_URL = "/api/comments";
      const TIMEOUT_MS = 8000;  // 每次請求最多等 8 秒
      const LIMITS = { name: 20, body: 200 };  // 跟 api/comments.js 的上限一致；真正的檢查在後端

      // 翻譯表：data-i18n 的 key 與程式裡用到的訊息；{n} 這類會在 t() 換成參數
      const TEXT = {
        zh: {
          "meta.title": "留言板 | Mark Yang",
          "meta.description": "Mark Yang 作品集的留言板：想說什麼都可以，不用登入。",
          title: "留言板",
          lead: "想說什麼都可以，不用登入。",
          formLabel: "寫留言",
          name: "暱稱",
          body: "留言",
          namePlaceholder: "例如：路過的工程師",
          bodyPlaceholder: "建議、合作邀約，或打聲招呼",
          privacy: "留言會公開顯示，請勿留下電話、email 等個人資料。",
          submit: "送出留言",
          sending: "送出中…",
          count: "{n} / {max}",
          sent: "留言送出了，謝謝！",
          loading: "載入中…",
          empty: "還沒有人留言，來當第一個吧。",
          heading: "留言（{n}）",
          justNow: "剛剛",
          retry: "重試",
          "error.load": "讀不到留言（{reason}），請稍後再試。",
          "error.send": "送不出去（{reason}），留言還在表單裡，可以再按一次送出。",
          "error.timeout": "伺服器超過 8 秒沒有回應",
          "error.network": "連不上伺服器",
          "error.server": "伺服器出錯了（{status}）",
          "field.empty": "{label}不能空白",
          "field.tooLong": "{label}最多 {max} 個字"
        },
        en: {
          "meta.title": "Guestbook | Mark Yang",
          "meta.description": "Mark Yang's portfolio guestbook: say anything you like, no sign-in needed.",
          title: "Guestbook",
          lead: "Say anything you like. No sign-in needed.",
          formLabel: "Write a message",
          name: "Nickname",
          body: "Message",
          namePlaceholder: "e.g. A passing engineer",
          bodyPlaceholder: "Feedback, a collaboration idea, or just hi",
          privacy: "Messages are public. Please don't include phone numbers, emails, or other personal details.",
          submit: "Post message",
          sending: "Posting…",
          count: "{n} / {max}",
          sent: "Your message was posted. Thank you!",
          loading: "Loading…",
          empty: "No messages yet. Be the first!",
          heading: "Messages ({n})",
          justNow: "just now",
          retry: "Retry",
          "error.load": "Couldn't load messages ({reason}). Please try again later.",
          "error.send": "Couldn't post ({reason}). Your message is still in the form, so you can try again.",
          "error.timeout": "the server didn't respond within 8 seconds",
          "error.network": "couldn't reach the server",
          "error.server": "server error {status}",
          "field.empty": "{label} can't be blank",
          "field.tooLong": "{label} can be at most {max} characters"
        }
      };

      const form = document.getElementById("commentForm");
      const inputs = { name: document.getElementById("commentName"), body: document.getElementById("commentBody") };
      const counts = { name: document.getElementById("nameCount"), body: document.getElementById("bodyCount") };
      const fieldErrors = { name: document.getElementById("nameError"), body: document.getElementById("bodyError") };
      const submitButton = document.getElementById("submitButton");
      const submitLabel = document.getElementById("submitLabel");
      // Mac 用 ⌘、其他系統用 Ctrl
      const isMac = /Mac|iPhone|iPad/.test(navigator.userAgentData?.platform || navigator.platform || "");
      document.getElementById("submitKbd").textContent = `${isMac ? "⌘" : "Ctrl"} ↵`;
      const formStatus = document.getElementById("formStatus");
      const list = document.getElementById("commentList");

      // 畫面狀態：重畫（例如切換語言）時照這份資料重新產生，不用再打一次 API
      const state = { list: "loading", comments: [], listError: null, sending: false, formError: null, sent: false, invalid: [] };

      const { t, lang } = setupToolPage(TEXT, render);

      // 字數用「字」算，跟後端一樣（中文、emoji 都算一個字）
      const length = (text) => [...text.trim()].length;

      // 請求加上逾時；逾時、斷線、伺服器錯誤都轉成一個 { kind, status } 給畫面用
      async function request(options = {}) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
          const response = await fetch(API_URL, { ...options, signal: controller.signal });
          const data = await response.json().catch(() => ({}));
          return { response, data };
        } catch (error) {
          throw { kind: error.name === "AbortError" ? "timeout" : "network" };
        } finally {
          clearTimeout(timer);
        }
      }

      function reasonText(error) {
        if (error.kind === "timeout") return t("error.timeout");
        if (error.kind === "network") return t("error.network");
        return t("error.server", { status: error.status });
      }

      // 讀留言
      async function loadComments() {
        state.list = "loading";
        render();
        try {
          const { response, data } = await request();
          if (!response.ok) throw { kind: "server", status: response.status };
          state.comments = Array.isArray(data.comments) ? data.comments : [];
          state.list = "ready";
        } catch (error) {
          state.list = "error";
          state.listError = error;
        }
        render();
      }

      // 送留言：送出中鎖住按鈕，不管成功失敗最後都解鎖
      async function submitComment(event) {
        event.preventDefault();
        if (state.sending) return;
        state.sending = true;
        state.formError = null;
        state.sent = false;
        state.invalid = [];
        render();
        try {
          const { response, data } = await request({
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: inputs.name.value, body: inputs.body.value })
          });
          if (response.status === 400) {
            // 後端說哪一格不對：標在那一格底下；中文介面直接用伺服器的原因，英文介面依代碼換成英文
            state.invalid = Array.isArray(data.fieldErrors) ? data.fieldErrors : [];
            if (!state.invalid.some((e) => e.field)) state.formError = { kind: "message", text: data.error };
          } else if (!response.ok) {
            throw { kind: "server", status: response.status };
          } else {
            // 送出成功：把伺服器回的那一筆（含 id 與時間）放到最上面，表單清空
            state.comments = [data.comment, ...state.comments];
            if (state.list !== "ready") state.list = "ready";
            state.sent = true;
            form.reset();
          }
        } catch (error) {
          state.formError = error;
        } finally {
          state.sending = false;
          render();
          // 有欄位不合格時，游標直接跳到第一個要改的欄位
          const first = state.invalid.find((e) => inputs[e.field]);
          if (first) inputs[first.field].focus();
        }
      }

      function fieldMessage(error) {
        if (lang() === "zh" && error.message) return error.message;
        const label = t(error.field);
        return t(`field.${error.reason}`, { label, max: error.max });
      }

      // 依 state 重畫表單提示與留言列表；別人打的字一律用 textContent 放進畫面，不當成 HTML
      function render() {
        // 表單
        submitButton.disabled = state.sending;
        submitLabel.textContent = t(state.sending ? "sending" : "submit");
        form.setAttribute("aria-label", t("formLabel"));
        form.setAttribute("aria-busy", state.sending ? "true" : "false");
        for (const field of Object.keys(inputs)) {
          const n = length(inputs[field].value);
          counts[field].textContent = t("count", { n, max: LIMITS[field] });
          counts[field].classList.toggle("is-near-limit", n >= LIMITS[field] * 0.9);
          const error = state.invalid.find((e) => e.field === field);
          fieldErrors[field].textContent = error ? fieldMessage(error) : "";
          if (error) inputs[field].setAttribute("aria-invalid", "true");
          else inputs[field].removeAttribute("aria-invalid");
        }
        formStatus.dataset.state = state.formError ? "error" : state.sent ? "ok" : "";
        if (state.formError) {
          formStatus.textContent = state.formError.kind === "message" ? state.formError.text : t("error.send", { reason: reasonText(state.formError) });
        } else {
          formStatus.textContent = state.sent ? t("sent") : "";
        }

        // 列表
        list.dataset.state = state.list === "ready" && !state.comments.length ? "empty" : state.list;
        list.setAttribute("aria-busy", state.list === "loading" ? "true" : "false");
        list.replaceChildren();
        if (state.list === "loading") {
          list.append(message(t("loading")));
        } else if (state.list === "error") {
          list.append(message(t("error.load", { reason: reasonText(state.listError) })));
          const retry = document.createElement("button");
          retry.className = "button button-ghost";
          retry.type = "button";
          retry.textContent = t("retry");
          retry.addEventListener("click", loadComments);
          list.append(retry);
        } else if (!state.comments.length) {
          list.append(message(t("empty")));
        } else {
          const heading = document.createElement("h2");
          heading.className = "guestbook-heading";
          heading.textContent = t("heading", { n: state.comments.length });
          const ul = document.createElement("ul");
          ul.className = "guestbook-items";
          state.comments.forEach((comment) => ul.append(commentItem(comment)));
          list.append(heading, ul);
        }
      }

      function message(text) {
        const p = document.createElement("p");
        p.className = "tool-result-message";
        p.textContent = text;
        return p;
      }

      // 頭像底色：依暱稱算出固定的一組顏色（同一個暱稱永遠同色），四組都取自 design-tokens 既有的顏色
      const AVATAR_TONES = 4;
      function avatarTone(name) {
        let hash = 0;
        for (const char of name) hash = (hash * 31 + char.codePointAt(0)) >>> 0;
        return hash % AVATAR_TONES;
      }

      // 時間：一分鐘內「剛剛」、一週內用相對時間（3 分鐘前、2 天前），更早顯示短日期（11/26，跨年才加年份）
      // 完整時間放在 title，滑鼠停在上面看得到
      const MINUTE = 60 * 1000;
      const RELATIVE_STEPS = [["day", 24 * 60 * MINUTE], ["hour", 60 * MINUTE], ["minute", MINUTE]];
      function relativeTime(iso) {
        const date = new Date(iso);
        const diff = Date.now() - date.getTime();
        const locale = lang() === "zh" ? "zh-TW" : "en-US";
        if (diff < MINUTE) return t("justNow");
        if (diff < 7 * 24 * 60 * MINUTE) {
          const [unit, size] = RELATIVE_STEPS.find(([, ms]) => diff >= ms);
          return new Intl.RelativeTimeFormat(locale, { numeric: "always" }).format(-Math.floor(diff / size), unit);
        }
        const sameYear = date.getFullYear() === new Date().getFullYear();
        return date.toLocaleDateString(locale, sameYear ? { month: "numeric", day: "numeric" } : { year: "numeric", month: "numeric", day: "numeric" });
      }
      function fullTime(iso) {
        return new Date(iso).toLocaleString(lang() === "zh" ? "zh-TW" : "en-US", { dateStyle: "long", timeStyle: "short" });
      }
      function updateTime(node) {
        node.textContent = relativeTime(node.dateTime);
        node.title = fullTime(node.dateTime);
      }

      function commentItem(comment) {
        const li = document.createElement("li");
        li.className = "guestbook-item";
        // 頭像：暱稱第一個字＋依暱稱固定的底色；暱稱只有一個字時頭像改放人形圖示，不會跟暱稱重複
        const name = comment.name.trim();
        const avatar = document.createElement("span");
        avatar.className = "guestbook-avatar";
        avatar.dataset.tone = avatarTone(name);
        avatar.setAttribute("aria-hidden", "true");
        if ([...name].length > 1) avatar.textContent = [...name][0];
        else avatar.innerHTML = '<svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></svg>';
        const content = document.createElement("div");
        content.className = "guestbook-content";
        const meta = document.createElement("p");
        meta.className = "guestbook-meta";
        const nameNode = document.createElement("strong");
        nameNode.textContent = comment.name;
        const time = document.createElement("time");
        time.dateTime = comment.createdAt;
        updateTime(time);
        meta.append(nameNode, time);
        const body = document.createElement("p");
        body.className = "guestbook-body";
        body.textContent = comment.body;
        content.append(meta, body);
        li.append(avatar, content);
        return li;
      }

      // 每分鐘只更新時間文字（不重畫整個列表，螢幕閱讀器才不會每分鐘重念一次）
      setInterval(() => list.querySelectorAll("time").forEach(updateTime), MINUTE);

      // 打字時更新字數，並清掉那一格的錯誤提示
      for (const field of Object.keys(inputs)) {
        inputs[field].addEventListener("input", () => {
          state.invalid = state.invalid.filter((e) => e.field !== field);
          state.sent = false;
          render();
        });
      }
      form.addEventListener("submit", submitComment);
      // 暱稱按 Enter 不直接送出，而是跳到留言框；留言框按 Ctrl（Mac 是 ⌘）+ Enter 送出
      inputs.name.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.isComposing) return;
        event.preventDefault();
        inputs.body.focus();
      });
      inputs.body.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      loadComments();
    </script>
  </body>
</html>
